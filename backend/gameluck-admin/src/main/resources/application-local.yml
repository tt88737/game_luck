--- # Local development overrides
spring.boot.admin.client:
  enabled: false

client:
  auth:
    token-secret: ${CLIENT_AUTH_TOKEN_SECRET:local-client-token-secret}

--- # Disable SnailJob for the first local backend startup
snail-job:
  enabled: false
  port: 28080

--- # Local MySQL and Redis
spring:
  datasource:
    dynamic:
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/gameluck_vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
          username: root
          password: root
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: gameluck123
      timeout: 10s
      ssl.enabled: false

--- # Keep local startup minimal
mail:
  enabled: false

sms:
  restricted: true

payment:
  providers:
    simulated:
      enabled: true
      secret: ${PAYMENT_SIMULATED_SECRET:local-simulated-payment-secret}
      checkout-base-url: http://127.0.0.1:5174/simulated-checkout
      webhook-base-url: http://127.0.0.1:8080/payment/webhooks
      session-ttl-minutes: 15
      signature-tolerance-seconds: 300
